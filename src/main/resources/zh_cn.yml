# ===== 侧栏记分板 =====
# 三套布局: lobby(不在对局) / game(对局中) / spectator(观战中)
# 每行支持 %player% 和全部 %gomoku_xxx% 占位符; "" 表示空行
# 想让某个语言用不同布局, 直接改对应语言文件即可
scoreboard:
  enabled: true
  # 刷新间隔 (tick, 20 = 1 秒)
  update-interval: 20
  lobby:
    title: "&6&lGomoku &7- &f大厅"
    lines:
      - "&7玩家: &f%player%"
      - "&7等级: &eLv.%gomoku_level%"
      - "&a胜:%gomoku_wins% &c负:%gomoku_losses% &7平:%gomoku_draws%"
      - "&7胜率: &f%gomoku_winrate%"
      - ""
      - "&7进行中对局: &f%gomoku_playing_room_count%"
      - ""
      - "&e/gomoku join auto"
      - "&7点击加入对局"
  game:
    title: "&6&lGomoku &7- &f%gomoku_room%"
    lines:
      - "&7房间: &f%gomoku_room%"
      - "&7你: %gomoku_color%"
      - "&7对手: &f%gomoku_opponent%"
      - ""
      - "&7当前: &e%gomoku_countdown%"
      - "&7已落子: &f%gomoku_move_count%"
      - ""
      - "&e/gomoku leave"
      - "&7退出对局"
  spectator:
    title: "&6&lGomoku &7- &f观战 &7- &f%gomoku_room%"
    lines:
      - "&7房间: &f%gomoku_room%"
      - "&0黑方: &f%gomoku_black_player%"
      - "&f白方: &f%gomoku_white_player%"
      - ""
      - "&7当前: &e%gomoku_countdown%"
      - "&7已落子: &f%gomoku_move_count%"
      - ""
      - "&e/gomoku leave"
      - "&7退出观战"

# 编辑模式棋盘识别斧
axe-given: "&6[棋盘识别斧] &7使用方法:\n&7  &e左键 &7点击棋盘井字线上任意一块 → 自动识别整块棋盘\n&7  &e右键 &7取消识别\n&7  手持时不破坏方块、不触发方块交互\n&7  识别结果直接写入房间, 接着 &e/gomoku admin playerspawn &7再 &e/gomoku admin save <房间>"
