# Help
help-header: "&6===== &eGomoku &6====="
help-admin: "&6--- Admin commands ---\n&f1.&e /gomoku setlobby &7set the lobby (and this world's respawn)\n&f2.&e/gomoku &4admin&a add <room> &7create a room world\n&f3.&e/gomoku &4admin&a build <room> &7enter room edit mode\n&f4.&e/gomoku &4admin&a dish <size> &7preview the board (15-64)\n&f5.&e/gomoku &4admin&a fill <line> <fill> <periphery> &7build the board\n&f6.&e/gomoku &4admin&a check <black_name> <white_name> &7set pieces (hotbar slots 1-2)\n&f7.&e/gomoku &4admin&a playerspawn &7set the player spawn\n&f8.&e/gomoku &4admin&a save <room> &7save and enable\n&f9.&e/gomoku &4admin&a clear <room> &7delete the room\n&f10.&e/gomoku &4admin&a delete [no|list] &7delete a cached board\n&f11.&e/gomoku &4admin&a reload &7reload config"
help-player: "&e/gomoku &ajoin <room|auto>  &e/gomoku &aleave  &e/gomoku &astats [player]  &e/gomoku &aspectate <room>  &e/gomoku &agui  &e/gomoku &apieceshop"
help-rules: "&6--- Rules ---\n&7Each move has &e60&7s (&eturn-seconds &7in &econfig.yml&7)\n&7Timeout voids the round - &cno points for either side\n&7Dying in a match returns you to the lobby\n&7Aim at a board cell and &eleft-click &7to move"

