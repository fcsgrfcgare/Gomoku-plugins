# ===== Sidebar scoreboard =====
# Three layouts: lobby (not in a match) / game (playing) / spectator (watching)
# Each line supports %player% and every %gomoku_xxx% placeholder; "" is a blank row
# Each language can use its own layout just by editing its file
scoreboard:
  enabled: true
  # Refresh interval in ticks (20 = 1 second)
  update-interval: 20
  lobby:
    title: "&6&lGomoku &7- &fLobby"
    lines:
      - "&7Player: &f%player%"
      - "&7Level: &eLv.%gomoku_level%"
      - "&aW:%gomoku_wins% &cL:%gomoku_losses% &7D:%gomoku_draws%"
      - "&7Win rate: &f%gomoku_winrate%"
      - ""
      - "&7Matches running: &f%gomoku_playing_room_count%"
      - ""
      - "&e/gomoku join auto"
      - "&7Click to join a match"
  game:
    title: "&6&lGomoku &7- &f%gomoku_room%"
    lines:
      - "&7Room: &f%gomoku_room%"
      - "&7You: %gomoku_color%"
      - "&7Opponent: &f%gomoku_opponent%"
      - ""
      - "&7Now: &e%gomoku_countdown%"
      - "&7Stones: &f%gomoku_move_count%"
      - ""
      - "&e/gomoku leave"
      - "&7Leave the match"
  spectator:
    title: "&6&lGomoku &7- &fSpectate &7- &f%gomoku_room%"
    lines:
      - "&7Room: &f%gomoku_room%"
      - "&0Black: &f%gomoku_black_player%"
      - "&fWhite: &f%gomoku_white_player%"
      - ""
      - "&7Now: &e%gomoku_countdown%"
      - "&7Stones: &f%gomoku_move_count%"
      - ""
      - "&e/gomoku leave"
      - "&7Stop spectating"

